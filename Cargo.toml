[package]
name = "cplang"
version = "0.1.0"
edition = "2024"

[dependencies]
test_derive = { path = "src/test_derive" }
rollback_derive = { path = "src/compiler/type_resolver/rollback_derive" }

[profile.release]
lto = false
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.measure]
inherits = "release"
strip = false

[features]
trace = []
measure = []

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "my_benchmark"
harness = false