[package]
name = "cplang"
version = "0.1.0"
edition = "2024"

[dependencies]
test_derive = { path = "src/test_derive" }
rollback_derive = { path = "src/compiler/type_resolver/rollback_derive" }
call_counter_derive = { path = "src/call_counter_derive" }
# Only used to turn recorded return addresses into function names when the
# counts are printed, never while counting.
backtrace = { version = "0.3", optional = true }

[profile.release]
lto = false
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.measure]
inherits = "release"
strip = false

[features]
trace = []
measure = []
count_calls = ["dep:backtrace"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "my_benchmark"
harness = false
